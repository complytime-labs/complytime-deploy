name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Skaffold Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0

      - name: Add tools to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install deploy tools
        run: task tools:install-deploy

      - name: Validate all profiles
        run: task sk:validate

      - name: Render all profiles
        run: task sk:render-all

      - name: Install scan tools
        run: task tools:install-scan

      - name: Scan with Checkov
        run: |
          checkov -d .rendered-manifests/ \
            --framework kubernetes \
            --output sarif \
            --output-file-path .rendered-manifests/ \
            --soft-fail
        continue-on-error: true

      - name: Scan with Trivy
        run: |
          trivy config .rendered-manifests/ \
            --format sarif \
            --output .rendered-manifests/trivy-results.sarif \
            --exit-code 0

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kustomize-scan-results
          path: .rendered-manifests/
          retention-days: 7

      - name: Upload Checkov SARIF to Code Scanning
        if: always() && hashFiles('.rendered-manifests/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: .rendered-manifests/results_sarif.sarif
          category: checkov-kustomize

      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('.rendered-manifests/trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: .rendered-manifests/trivy-results.sarif
          category: trivy-kustomize
