name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run MegaLinter
        id: megalinter
        uses: trevor-vaughan/megalint-config@latest # zizmor: ignore[unpinned-uses]
        with:
          validate-all-codebase: ${{ github.event_name == 'push' && 'true' || 'false' }}

      - name: Upload MegaLinter reports
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: megalinter-reports
          path: |
            ${{ steps.megalinter.outputs.reports-dir }}
            mega-linter.log
          retention-days: 7

      - name: Upload SARIF to Code Scanning
        if: ${{ (success() || failure()) && steps.megalinter.outputs.sarif-has-results == 'true' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.megalinter.outputs.sarif-file }}
          category: megalinter
