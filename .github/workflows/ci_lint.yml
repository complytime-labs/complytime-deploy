name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Run MegaLinter
        id: megalinter
        uses: trevor-vaughan/megalint-config@latest # zizmor: ignore[unpinned-uses]
        with:
          validate-all-codebase: ${{ github.event_name == 'push' && 'true' || 'false' }}

      - name: Upload MegaLinter reports
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: megalinter-reports
          path: |
            ${{ steps.megalinter.outputs.reports-dir }}
            mega-linter.log
          retention-days: 7

      - name: Upload SARIF to Code Scanning
        if: ${{ (success() || failure()) && steps.megalinter.outputs.sarif-has-results == 'true' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: ${{ steps.megalinter.outputs.sarif-file }}
          category: megalinter
