name: Scheduled Security

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  actions: none
  id-token: none
  security-events: none

jobs:
  call_reusable_scheduled:
    name: Scheduled Scan
    uses: complytime/org-infra/.github/workflows/reusable_scheduled.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
