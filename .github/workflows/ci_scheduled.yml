name: Scheduled Security

on:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  actions: none
  id-token: none
  security-events: none

jobs:
  call_reusable_scheduled:
    name: Scheduled Scan
    uses: complytime/org-infra/.github/workflows/reusable_scheduled.yml@0c784711926c9864f027ec565fd7c06a382d80f8 # v0.7.1
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
